<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عضویت</title>
    <link rel="stylesheet" href="singup.css">
</head>

<body>
    <div class="signup-container">
        <form class="signup-box">

            <h1>ساخت حساب</h1>

            <div class="input-box">
                <label for="name">نام کامل</label>
                <input type="text" id="name" placeholder="نام کامل خود را وارد کنید">
            </div>

            <div class="input-box">
                <label for="phonenumber">شماره تلفن</label>
                <input type="tel" id="phonenumber" placeholder="مثلا 09120000000">
            </div>

            <div class="input-box">
                <label for="password">رمز عبور</label>
                <input type="password" id="password" placeholder="رمز عبور خود را وارد کنید">
            </div>

            <div class="input-box">
                <label for="repeatPassword">تکرار رمز عبور</label>
                <input type="password" id="repeatPassword" placeholder="رمز عبور خود را تکرار کنید">
            </div>

            <button type="submit" class="btn next">بعدی</button>

        </form>
    </div>
</body>
</html>
